version: "1.0"
name: example-strict-policy
description: |
  Example policy for the clawforge-governed demo agent. Mirrors the
  shape of AGT's own example/strict.yaml so this works as both a
  Clawforge integration test and a familiar AGT fixture.
rules:
  - name: deny_shell
    condition: { field: tool_name, operator: eq, value: shell_exec }
    action: deny
    priority: 100
    message: shell access is denied for governed agents

  - name: deny_delete
    condition: { field: tool_name, operator: eq, value: delete_file }
    action: deny
    priority: 100
    message: file deletion is denied for governed agents

  - name: allow_read
    condition: { field: tool_name, operator: eq, value: read_file }
    action: allow
    priority: 50

  - name: allow_search
    condition: { field: tool_name, operator: eq, value: web_search }
    action: allow
    priority: 50

  - name: deny_large_token_calls
    condition: { field: token_count, operator: gt, value: 4096 }
    action: deny
    priority: 90
    message: token budget exceeded

defaults:
  action: deny
  max_tokens: 4096
  max_tool_calls: 10
  confidence_threshold: 0.8
